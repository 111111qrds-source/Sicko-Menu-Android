name: Compilar APK do Mod Menu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Codigo
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar SDK do Android
      uses: android-actions/setup-android@v3

    - name: Instalar NDK e CMake
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Compilar APK Debug
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Enviar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: mod-menu-apk
        path: app/build/outputs/apk/debug/*.apk
