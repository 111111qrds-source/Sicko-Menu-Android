name: Compilar APK do Mod Menu

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Codigo do Repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Aceitar Licencas do Android SDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Corrigir Formato de Linha do Gradlew
      run: sed -i -e 's/\r$//' gradlew

    - name: Compilar APK Debug
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Enviar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: mod-menu-apk
      
        path: app/build/outputs/apk/debug/*.apk
